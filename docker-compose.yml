services:
  # One-shot: HAPI runs as uid 65532 and needs to own its data volume.
  hapi-init:
    image: busybox
    command: chown -R 65532:65532 /data/hapi
    volumes:
      - hapi-data:/data/hapi

  hapi:
    image: hapiproject/hapi:latest
    # Docker-published ports bypass ufw: bind to localhost only.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      spring.datasource.url: jdbc:h2:file:/data/hapi/h2db
      spring.datasource.username: sa
      spring.datasource.password: ""
      spring.datasource.driverClassName: org.h2.Driver
    volumes:
      - hapi-data:/data/hapi
    depends_on:
      hapi-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  hapi-data:

[project]
name = "hdab"
version = "0.1.0"
description = "EHDS Health Data Access Body prototype (AIM Hackathon 2026, Track 3)"
readme = "README.md"
authors = [
    { name = "Noah Lima Stockinger" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

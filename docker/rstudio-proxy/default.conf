map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8787;
    client_max_body_size 1m;

    # RStudio serves files of the session on these routes, whatever `allow-file-downloads` says; `p` reaches any web
    # server started inside the session. The price: the Viewer pane and R Markdown previews do not work.
    location ~* ^/(files|file_show|file_download|export|upload|session|content|show|chunk_output|html_preview|rmd_data|rmd_output|view_pdf|presentation|tutorial|preview|p)(/|$) {
        default_type text/plain;
        return 403 "Download refused. Only anonymised results may leave the secure processing environment (Art. 73).\n";
    }

    location / {
        proxy_pass http://unix:/run/rstudio-socket/rstudio.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
        proxy_buffering off;
    }
}
